name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - admin-ui
      - 'arena/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  PAYLOAD_SECRET: ci-verification-payload-secret-key-at-least-32-chars
  NEXT_PUBLIC_SITE_URL: http://localhost:3000

jobs:
  validate:
    name: Typecheck, Lint, Integration & Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Payload types, importMap, DB schema & nav icons
        run: pnpm run generate:all

      - name: Run TypeScript type check
        run: pnpm exec tsc --noEmit

      - name: Run ESLint
        run: pnpm run lint

      - name: Run Vitest integration suite
        env:
          POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/pocms
        run: pnpm run test:int

      - name: Verify Playwright E2E spec graph
        run: pnpm exec playwright test --list

      - name: Compile Next.js + Payload production bundle
        env:
          POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/pocms
          NODE_OPTIONS: '--no-deprecation --max-old-space-size=6144'
        run: pnpm exec next build --experimental-build-mode compile

  e2e:
    name: Playwright E2E & Accessibility
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pocms
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d pocms"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      CI: 'true'
      POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/pocms
      POSTGRES_URL_NON_POOLING: postgres://postgres:postgres@127.0.0.1:5432/pocms
      PLAYWRIGHT_BASE_URL: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Payload artifacts
        run: pnpm run generate:all

      - name: Install Playwright Chromium browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Bootstrap PostgreSQL schema & seed portfolio content
        env:
          NODE_ENV: development
        run: pnpm run seed

      - name: Run Playwright E2E & WCAG accessibility tests
        run: pnpm run test:e2e

      - name: Verify Phase 1 SQL migrations & CONCURRENTLY index optimizations
        run: |
          pnpm run db:migrate
          pnpm run db:optimize-indexes
          pnpm run db:optimize-indexes
          node -e '
            const pg = require("pg");
            (async () => {
              const client = new pg.Client({ connectionString: process.env.POSTGRES_URL });
              await client.connect();
              const mig = await client.query("SELECT name, batch FROM payload_migrations WHERE name = $1", ["20261031_001_phase1_integrity_and_indexes"]);
              if (mig.rowCount !== 1) throw new Error("Expected Phase 1 migration to be recorded in payload_migrations");
              const idx = await client.query("SELECT indexname FROM pg_indexes WHERE schemaname = \x27public\x27 AND indexname = ANY($1)", [[
                "idx_articles_public_feed",
                "idx_projects_public_feed",
                "idx_mail_threads_search_trgm",
                "idx_payload_jobs_runnable",
                "idx_pld_rels_articles_nn",
                "header_texts_parent_path_order_idx"
              ]]);
              if (idx.rowCount !== 6) throw new Error("Expected all 6 verified Phase 1 indexes in pg_indexes, got " + idx.rowCount);
              const fk = await client.query("SELECT confdeltype FROM pg_constraint WHERE conname = \x27mail_messages_thread_id_mail_threads_id_fk\x27");
              if (fk.rows[0]?.confdeltype !== "c") throw new Error("Expected ON DELETE CASCADE (c) on mail_messages.thread_id FK");
              await client.end();
              console.log("Verified Phase 1 migration ledger, pg_trgm/partial/composite indexes, and ON DELETE CASCADE FK in live PostgreSQL 16!");
            })().catch((err) => { console.error(err); process.exit(1); });
          '

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
