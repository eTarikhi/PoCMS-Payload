name: CI

on:
  push:
    branches: [main, dev, front-dev, 'arena/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PAYLOAD_SECRET: ci-only-secret-not-used-anywhere-else
  POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/pocms
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Lint, types, generated files, integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pocms
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d pocms"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck

      # Generated files must be committed. A dummy token in the documented format enables the Vercel
      # Blob plugin, so the types match production (media._objectKey). No Blob API call is made.
      - name: Generated files are up to date
        env:
          BLOB_READ_WRITE_TOKEN: vercel_blob_rw_ci0000_ci0000
        run: |
          pnpm generate:types
          pnpm generate:importmap
          git diff --exit-code -- src/payload-types.ts 'src/app/(payload)/admin/importMap.js'

      - name: Admin token contrast (WCAG AA)
        run: |
          if [ -f scripts/check-contrast.mjs ]; then node scripts/check-contrast.mjs; fi

      - name: Integration tests
        run: pnpm test:int

  e2e:
    name: Build and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pocms
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d pocms"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The seed runs outside production mode, so it also pushes the schema to the empty database.
      - name: Seed the database
        run: pnpm seed
      - name: Build
        run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
