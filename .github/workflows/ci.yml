name: CI

on:
  push:
    branches: [main, dev, front-dev, 'arena/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PAYLOAD_SECRET: ci-only-secret-not-used-anywhere-else
  POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/pocms
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Lint, types, generated files, integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pocms
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d pocms"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck

      # Generated files must be committed and current (scripts/generate.mjs supplies a placeholder
      # Blob token so they match production; no Blob API call is made).
      - name: Generated files are up to date
        run: |
          pnpm generate:all
          git diff --exit-code -- src/payload-types.ts src/payload-generated-schema.ts schema.graphql 'src/app/(payload)/admin/importMap.js'

      - name: Admin token contrast (WCAG AA)
        run: pnpm check:contrast
      - name: Admin Tailwind classes carry the acn prefix
        run: pnpm check:tw-prefix

      - name: Integration tests
        run: pnpm test:int

  e2e:
    name: Build and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pocms
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d pocms"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The seed runs outside production mode, so it also pushes the schema to the empty database.
      - name: Seed the database
        run: pnpm seed
      - name: Build
        run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      # Also runs the bundle budget check (tests/e2e/bundle.e2e.spec.ts): it measures a production
      # build, so it only asserts when BUNDLE_BUDGET is set.
      - name: End-to-end tests
        run: pnpm test:e2e
        env:
          BUNDLE_BUDGET: '1'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
