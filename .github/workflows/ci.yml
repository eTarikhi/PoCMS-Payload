name: CI

on:
  push:
    branches: [main, dev, front-dev, 'arena/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PAYLOAD_SECRET: ci-only-secret-not-used-anywhere-else
  POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/pocms
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Lint, types, generated files, integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pocms
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d pocms"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck

      # Generated files must be committed and current (scripts/generate.mjs supplies a placeholder
      # Blob token so they match production; no Blob API call is made).
      - name: Generated files are up to date
        run: |
          pnpm generate:all
          git diff --exit-code -- src/payload-types.ts src/payload-generated-schema.ts schema.graphql 'src/app/(payload)/admin/importMap.js'

      - name: Admin token contrast (WCAG AA)
        run: pnpm check:contrast
      - name: Admin Tailwind classes carry the acn prefix
        run: pnpm check:tw-prefix

      # The schema comes from src/migrations (the adapter has push disabled), so the service's
      # empty database is migrated before anything connects to it.
      - name: Migrate the database
        run: pnpm migrate
      # Vitest runs the Local API integration tests and the admin's component tests (jsdom); the
      # config keeps the unit files in the same run, `test:unit` exists for a focused loop.
      - name: Unit and integration tests
        run: pnpm test:int

  e2e:
    name: Build and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pocms
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d pocms"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Migrations first: the seed writes through Payload, and the adapter no longer pushes a
      # schema in development mode, so an unmigrated database has no tables to write to.
      - name: Migrate the database
        run: pnpm migrate
      - name: Seed the database
        run: pnpm seed
      - name: Build
        run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      # Also runs the bundle budget check (tests/e2e/bundle.e2e.spec.ts): it measures a production
      # build, so it only asserts when BUNDLE_BUDGET is set. The accessibility gate
      # (tests/e2e/a11y.e2e.spec.ts) runs here too and writes test-results/a11y-<theme>.json, which
      # the visual artifacts step below uploads.
      - name: End-to-end tests
        run: pnpm test:e2e
        env:
          BUNDLE_BUDGET: '1'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Visual regression, platform-independent half: tokens loaded, no sideways scroll at any of
      # the three live-preview widths in both themes, no broken images, dark mode still dark. This
      # gates the build. The numbers land in test-results/visual-invariants.json.
      - name: Visual invariants (layout, tokens, themes)
        run: pnpm exec playwright test --config=playwright.config.ts visual/invariants

      # Visual review: capture every baseline screen (light/dark, 1440/768/375) against the same
      # production build. Pixel comparisons are platform-specific (font rasterisation), so CI does
      # not assert them; the captures are uploaded for review and the suite runs here to prove the
      # capture path (logins, navigation, both themes) still works. To compare pixels, run
      # `pnpm test:visual --update-snapshots` on the platform that owns the baselines.
      - name: Visual captures
        run: pnpm test:visual
        env:
          CAPTURE_DIR: playwright-captures
          CAPTURE_WIDTHS: '1440,375'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual-captures
          path: |
            playwright-captures/
            test-results/visual-invariants.json
            test-results/a11y-*.json
          retention-days: 7
