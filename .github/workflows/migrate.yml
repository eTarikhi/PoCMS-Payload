name: Migrate database

# Runs the committed migrations against a deployed database. Vercel has no shell on the Hobby plan
# and the build must not touch the production schema, so this is the deployment step: trigger it
# after a deploy that includes new migrations in src/migrations.
#
# Setup: repository secret POSTGRES_URL (the production connection string) and, for the first run
# on a database created by development schema push, run `pnpm migrate:adopt` locally once (see
# docs/deployment.md). The `production-db` environment can require a reviewer.

on:
  workflow_dispatch:
    inputs:
      status_only:
        description: 'Only print migrate:status (no changes)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: migrate-database
  cancel-in-progress: false

env:
  # Placeholder values keep the config loadable; the job only talks to the database.
  PAYLOAD_SECRET: ci-only-secret-not-used-anywhere-else
  BLOB_READ_WRITE_TOKEN: vercel_blob_rw_codegen0_placeholder0
  NEXT_PUBLIC_SITE_URL: https://example.com
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  migrate:
    name: Run payload migrate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-db
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Status before
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        run: pnpm migrate:status

      - name: Apply migrations
        if: ${{ !inputs.status_only }}
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        run: pnpm migrate

      - name: Status after
        if: ${{ !inputs.status_only }}
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        run: pnpm migrate:status
