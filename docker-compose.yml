services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pocms
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d pocms']
      interval: 5s
      timeout: 5s
      retries: 10

  payload:
    image: node:22.17.0-alpine
    ports:
      - '3000:3000'
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
    working_dir: /home/node/app/
    env_file:
      - .env
    environment:
      POSTGRES_URL: postgres://postgres:postgres@postgres:5432/pocms
      POSTGRES_URL_NON_POOLING: postgres://postgres:postgres@postgres:5432/pocms
      HOSTNAME: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "corepack enable pnpm &&
             pnpm install --frozen-lockfile &&
             pnpm run generate:all &&
             pnpm exec next dev -H 0.0.0.0"

volumes:
  pgdata:
  node_modules:
