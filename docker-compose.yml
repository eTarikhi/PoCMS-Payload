# Local development only. See docs/docker.md before starting against existing data.
services:
  payload:
    image: node:22-bookworm-slim
    init: true
    working_dir: /home/node/app
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
    command: sh -c "corepack enable && corepack prepare pnpm@10.17.1 --activate && pnpm install --frozen-lockfile && pnpm dev --hostname 0.0.0.0"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_ADAPTER: postgres
      # Use a generated hex password: reserved URL characters need encoding in connection URLs.
      POSTGRES_URL: postgres://pocms:${POCMS_POSTGRES_PASSWORD:?Set a private hex POCMS_POSTGRES_PASSWORD in .env}@postgres:5432/pocms
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Set a private PAYLOAD_SECRET in .env}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: pocms
      POSTGRES_DB: pocms
      POSTGRES_PASSWORD: ${POCMS_POSTGRES_PASSWORD:?Set a private hex POCMS_POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Do not expose PostgreSQL on the host network.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
volumes:
  postgres_data:
  node_modules:
