services:
  payload:
    image: node:22.17.0-alpine
    ports:
      - '3000:3000'
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
    working_dir: /home/node/app/
    env_file:
      - .env
    environment:
      HOSTNAME: 0.0.0.0
    command: >
      sh -c "corepack enable pnpm &&
             pnpm install --frozen-lockfile &&
             pnpm run generate:all &&
             pnpm exec next dev -H 0.0.0.0"

volumes:
  node_modules:
