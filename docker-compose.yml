version: '3'

services:
  payload:
    image: node:20-alpine
    ports:
      - '3000:3000'
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
    working_dir: /home/node/app/
    command: sh -c "corepack enable && corepack prepare pnpm@latest --activate && pnpm install && pnpm dev"
    depends_on:
      - postgres
    environment:
      # Hostname must be the service name, not localhost.
      POSTGRES_URL: postgres://pocms:pocms@postgres:5432/pocms
    env_file:
      - .env

  # The stack uses @payloadcms/db-vercel-postgres (any PostgreSQL connection string works).
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: pocms
      POSTGRES_PASSWORD: pocms
      POSTGRES_DB: pocms
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  node_modules:
  pgdata:
